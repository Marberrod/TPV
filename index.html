<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Factura de Compra</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 0;
            padding: 0;
            background-color: #f9f9f9;
        }

        .container {
            width: 70%;
            margin: 50px auto;
            background-color: #ffffff;
            padding: 30px;
            box-shadow: 0px 0px 15px rgba(0, 0, 0, 0.1);
            border-radius: 8px;
        }

        .header {
            text-align: center;
        }

        .header img {
            width: 100px;
        }

        .header h1 {
            font-size: 24px;
            color: #333;
        }

        .header p {
            font-size: 16px;
            color: #777;
        }

        table {
            width: 100%;
            margin: 20px 0;
            border-collapse: collapse;
        }

        table th,
        table td {
            padding: 10px;
            text-align: center;
            border: 1px solid #ddd;
        }

        table th {
            background-color: #4CAF50;
            color: white;
        }

        .total {
            text-align: right;
            font-size: 18px;
            margin-top: 20px;
        }

        .footer {
            margin-top: 30px;
            text-align: center;
            font-size: 14px;
        }

        .footer p {
            color: #555;
        }

        .footer span {
            font-weight: bold;
        }

        .date {
            text-align: right;
            font-size: 16px;
            margin-top: 10px;
        }
    </style>
</head>

<body>
    <div class="container">
        <!-- Header -->
        <div class="header">
            <img src="logo.jpg" alt="Logo">
            <h1>Factura de Compra</h1>
            <p>Gracias por su compra en nuestra tienda</p>
        </div>

        <!-- Tabla de Productos -->
        <table>
            <thead>
                <tr>
                    <th>CANTIDAD</th>
                    <th>PRODUCTO</th>
                    <th>PRECIO</th>
                    <th>TOTAL</th>
                </tr>
            </thead>
            <tbody>
                <!-- START -->
                <!-- END -->
            </tbody>
        </table>


        <div class="footer">
            <p>Gracias por su preferencia</p>
            <p><span>Dirección:</span> Calle Ficticia, 123, Ciudad, País</p>
            <p><span>Teléfono:</span> +34 912 345 678</p>
        </div>
    </div>
</body>

</html>
